version: '3.8'

services:
  centerpoint_inference:
    build:
      # build context is the project root so the Dockerfile in /deploy can COPY the application sources
      context: ..
      dockerfile: deploy/Dockerfile
    image: centerpoint-inference:v1
    container_name: centerpoint_inference_service
    # GPU access: legacy `runtime: nvidia` is more widely accepted by local docker-compose schemas.
    # If your `docker compose` supports `device_requests`, you can replace this with that block.
    runtime: nvidia
    environment:
      # Use gunicorn concurrency based on GPU memory. Override at compose/runtime if needed.
      - WEB_CONCURRENCY=1
      # Prefer CUDA provider in ONNX Runtime when available
      - ORT_PROVIDERS=CUDAExecutionProvider,CPUExecutionProvider
      # NVIDIA visibility (legacy fallback). Set to 'all' to expose all GPUs.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    ports:
      - "8010:8010"
    volumes:
      # Datasets must be mounted for local 0-copy inference
      - /mnt/synology/datasets:/mnt/synology/datasets:ro
      # Mounting only the inference code is unnecessary; image contains code. Mount for development only.
      #- ../inference_service:/app:ro
    restart: unless-stopped
    healthcheck:
      # The application exposes readiness at /v1/health/ready
      test: ["CMD", "curl", "-f", "http://localhost:8010/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
